# Xcode project for ClaudeDeck. Generate with:  xcodegen generate
# (ClaudeDeck.xcodeproj is generated — edit this file, not the project.)
name: ClaudeDeck
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Team, bundle prefix and version live in Config/Shared.xcconfig (override in Config/Local.xcconfig).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    # Extract Text/String(localized:) literals into the string catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
targets:
  ClaudeDeckCore:
    type: library.static
    platform: macOS
    sources: [Sources/ClaudeDeckCore]
  ClaudeDeck:
    type: application
    platform: macOS
    sources:
      - Sources/ClaudeDeck
      - Support/Assets.xcassets   # AppIcon (generated by tools/make-icon.swift)
      - path: Support/THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - Support/Localizable.xcstrings   # English source, Turkish translation
    dependencies:
      - target: ClaudeDeckCore
      - package: SwiftTerm
      - target: ClaudeDeckWidget   # embedded in Contents/PlugIns
    entitlements:
      path: Support/ClaudeDeck.entitlements
      properties:
        # App Group shared with the widget (team-prefixed: no provisioning profile needed on macOS).
        com.apple.security.application-groups: [$(DECK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ClaudeDeck
        PRODUCT_NAME: ClaudeDeck
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys; carries CFBundleURLTypes (claudedeck://) for widget taps.
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeDeck
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Needs a real pty, ~/.claude and the user's shell: no App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  ClaudeDeckWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - target: ClaudeDeckCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ClaudeDeck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeDeckWidget.entitlements
      properties:
        # Widget extensions must be sandboxed.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(DECK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DECK_BUNDLE_PREFIX).ClaudeDeck.Widget
        PRODUCT_NAME: ClaudeDeckWidget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  ClaudeDeckCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ClaudeDeckCoreTests]
    dependencies:
      - target: ClaudeDeckCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClaudeDeck:
    build:
      targets:
        ClaudeDeck: all
        ClaudeDeckCoreTests: [test]
    test:
      targets: [ClaudeDeckCoreTests]
